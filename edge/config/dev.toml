# Laptop: Sony simulada, nube simulada, GPIO simulado por MQTT y spool en /tmp.
# Lo usa `anpr-dev` (ANPR_EDGE_CONFIG=config/dev.toml).

[camera]
# Sony real: "http://192.168.122.1:10000/sony/camera" (y `anpr-dev --camera real`)
rpc_url = "http://127.0.0.1:10000/sony/camera"

[capture]
spool_dir = "/tmp/anpr-spool"

[uplink]
# Nube simulada (anpr-sim-cloud). Otras opciones, con `anpr-dev --cloud config`:
#   API local:     "http://127.0.0.1:8000"   (cd api && uvicorn app.main:app)
#   Desplegada:    "https://d22z1x91kqav4d.cloudfront.net/api"
api_url = "http://127.0.0.1:8001"
device_key_file = "/data/anpr/secrets/device_api_key"

[gpio]
backend = "sim"

[gate]
# Igual que el simulador de la pluma (anpr-sim-plant --travel-s 6).
travel_open_s = 6.0
travel_close_s = 6.0
open_hold_max_s = 15.0

[health]
check_every_s = 10.0
