[project]
name = "anpr-edge"
version = "0.1.0"
description = "Servicios de campo de la Raspberry Pi (F5)"
# Raspberry Pi OS trae 3.11 (Bookworm) o 3.13 (Trixie): no subir el mínimo.
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Solo en la Pi. Mejor desde apt (python3-gpiozero, python3-lgpio) y venv con
# --system-site-packages: lgpio compilado para el kernel de Raspberry Pi OS.
pi = ["gpiozero>=2.0", "lgpio>=0.2"]
# Simuladores para la laptop: nube falsa y generación de imágenes de prueba.
sim = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "pillow>=10.0"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
# Servicios (uno por unidad systemd)
anpr-trigger = "anpr_edge.trigger.service:main"
anpr-capture = "anpr_edge.capture.service:main"
anpr-uplink = "anpr_edge.uplink.service:main"
anpr-gate = "anpr_edge.gate.service:main"
anpr-gate-safe-off = "anpr_edge.gate.safe_off:main"
anpr-health = "anpr_edge.health.service:main"
# Herramientas y simuladores (solo laptop)
anpr-probe-camera = "anpr_edge.tools.probe_camera:main"
anpr-sim-camera = "anpr_edge.sim.camera:main"
anpr-sim-cloud = "anpr_edge.sim.cloud:main"
anpr-sim-plant = "anpr_edge.sim.plant:main"
anpr-dev = "anpr_edge.dev.run_all:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Así declara FastAPI los parámetros: no es el error de B008.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anpr_edge"]
