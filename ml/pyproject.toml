[project]
name = "anpr-ml"
version = "1.0.0"
description = "Detección y lectura de placas (F4)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Post-procesado y pruebas: ligero, no necesita el stack de visión.
dev = ["pytest>=8.3", "ruff>=0.9"]

# Preparar datasets (conversión COCO->YOLO, recortes de vista de puerta).
# Pillow y no OpenCV: son unos MB frente a ~70, con el disco al 97%.
data = ["pillow>=11.0"]

# Solo para exportar el modelo y medir precisión. ~2-3 GB instalados.
train = ["ultralytics>=8.3", "torch>=2.5", "onnx>=1.17", "onnxruntime>=1.20"]

# Lo que realmente va dentro del contenedor Lambda: sin torch ni ultralytics.
runtime = ["onnxruntime>=1.20", "numpy>=2.0", "opencv-python-headless>=4.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anpr_ml"]
