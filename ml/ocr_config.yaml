# Configuración de PaddleOCR para leer el RECORTE de una placa.
#
# Reescrita a partir de legacy/mqtt-camara-main/ocr_config.yaml, que tenía dos
# problemas de fondo:
#
# 1. Rutas absolutas de Windows de otra persona
#    (C:\Users\Alexis\.paddlex\official_models\...). No cargaba en Linux ni en
#    el contenedor. Ahora se resuelven desde PADDLE_HOME.
#
# 2. Traía activado todo el preprocesado de DOCUMENTOS: orientación de página,
#    "desdoblado" (UVDoc) y orientación de línea. Son cuatro modelos extra
#    pensados para escanear folios torcidos, inútiles sobre el recorte de una
#    placa. Cargarlos engorda la imagen y alarga el cold start sin aportar nada.

pipeline_name: OCR
text_type: general

# Los cuatro interruptores que el legacy tenía en true.
use_doc_preprocessor: false
use_textline_orientation: false

SubModules:
  TextDetection:
    module_name: text_detection
    model_name: PP-OCRv5_mobile_det   # mobile, no server: el recorte es diminuto
    box_thresh: 0.6
    thresh: 0.3
    unclip_ratio: 1.5
    limit_side_len: 64
    limit_type: min
    max_side_limit: 4000

  TextRecognition:
    module_name: text_recognition
    model_name: en_PP-OCRv5_mobile_rec
    batch_size: 6
    # 0.0 en el legacy: aceptaba cualquier lectura por mala que fuera.
    # El post-procesado de anpr_ml.plate_text filtra después, pero dejar pasar
    # ruido desde aquí solo gasta ciclos.
    score_thresh: 0.3
